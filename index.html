<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lectura de Recibo de Luz CFE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Martin Rigoberto Ruiz Chavez</h1>
    <h2>Probabilidad y Estadística</h2>
    <h3>Factura de Consumo de Energía Eléctrica (CFE)</h3>

    <p><strong>Sube tu recibo (imagen o PDF):</strong></p>
    <input type="file" id="archivo" accept=".png,.jpg,.jpeg,.pdf" />
    <p id="estado"></p>

    <div>
      <label for="tarifa">Selecciona tarifa estimada:</label>
      <select id="tarifa">
        <option value="0.87">Doméstica 1 ($0.87/kWh)</option>
        <option value="1.20">Doméstica 1C ($1.20/kWh)</option>
        <option value="1.50">Doméstica de Alto Consumo (DAC) ($1.50/kWh)</option>
      </select>
    </div>

    <h4>Tu tarifa de consumo es la siguiente</h4>
    
    <div id="textoDetectado"></div>
    <div id="tabla"></div>
    <div id="total"></div>
    <div id="costo"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.2/dist/tesseract.min.js"></script>
  
  <script src="script.js"></script>
</body>
</html>
