<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Proyecto en GitHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="card">
        <h1>Panel de Control</h1>
        <p>Estado del sistema: <span id="status">Activo</span></p>

            <button id="mainBtn">Ejecutar Acción</button>
        </div>

        <div id="displayArea" class="display-none">
            <p id="resultText"></p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
