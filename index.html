<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Lector de Recibo CFE</title>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <!-- Tesseract OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
</head>

<body>

<h2>Analizador de Recibo CFE ⚡</h2>

<input type="file" id="archivo" accept=".pdf,image/*">
<br><br>

<label>Selecciona tarifa manual (si no se detecta):</label>
<select id="tarifaManual">
  <option value="1">Tarifa 1</option>
  <option value="1A">Tarifa 1A</option>
  <option value="1B">Tarifa 1B</option>
</select>

<p id="estado"></p>
<div id="resultado"></div>

<script src="script.js"></script>

</body>
</html>
